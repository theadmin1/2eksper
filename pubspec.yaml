name: eksper_mobile
description: 2EKSPER Oto Ekspertiz ve Galeri Mobil Uygulaması (iOS & Android)
publish_to: 'none'
version: 1.5.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  google_fonts: ^5.1.0
  font_awesome_flutter: ^10.5.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  webview_flutter: ^4.13.1
  printing: ^5.14.3
  pdf: ^3.11.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
